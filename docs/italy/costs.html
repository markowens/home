<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status of Purchased Events</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #23262b;
    --muted: #6b7280;
    --border: #e3e1db;
    --paid: #2f6f5e;
    --paid-soft: #e7f1ee;
    --unpaid: #b3541e;
    --unpaid-soft: #fbeee3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 780px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 24px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    text-align: left;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: #fafaf8;
  }

  th.col-cost, td.col-cost { text-align: right; }
  th.col-paid, td.col-paid { text-align: center; width: 130px; }

  tbody tr {
    border-bottom: 1px solid var(--border);
  }

  tbody tr:last-child { border-bottom: none; }

  td {
    padding: 12px 16px;
    font-size: 0.95rem;
  }

  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
  }

  .badge.paid {
    background: var(--paid-soft);
    color: var(--paid);
  }

  .badge.unpaid {
    background: var(--unpaid-soft);
    color: var(--unpaid);
  }

  tfoot td {
    padding: 12px 16px;
    font-weight: 700;
    border-top: 1px solid var(--border);
    background: #fafaf8;
  }

  tfoot .label {
    color: var(--muted);
    font-weight: 500;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Status of Purchased Events</h1>
    <p class="subtitle">Track what's been bought, what it cost, and who's paid.</p>

    <!--
      To update this table, edit the rows below directly.
      - For a paid cell, use: <td class="col-paid"><span class="badge paid">Paid</span></td>
      - For an unpaid cell, use: <td class="col-paid"><span class="badge unpaid">Unpaid</span></td>
      - Add or remove <tr>...</tr> blocks to add or remove items.
      - Remember to update the Total row in <tfoot> if costs change.
    -->
    <div class="panel">
      <table>
        <thead>
          <tr>
            <th class="col-item">Item</th>
            <th class="col-cost">Cost</th>
            <th class="col-paid">Owens' Paid</th>
            <th class="col-paid">Thornton Paid</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Colosseum Tour</td>
            <td class="col-cost">$600.00</td>
            <td class="col-paid"><span class="badge paid">Paid</span></td>
            <td class="col-paid"><span class="badge unpaid">Unpaid</span></td>
          </tr>
          <tr>
            <td>AirBnb</td>
            <td class="col-cost">$600.00</td>
            <td class="col-paid"><span class="badge paid">Paid</span></td>
            <td class="col-paid"><span class="badge unpaid">Unpaid</span></td>
          </tr>          
          <tr>
            <td>Train Ticket - Naples to Rome</td>
            <td class="col-cost">$252.33</td>
            <td class="col-paid"><span class="badge paid">Paid</span></td>
            <td class="col-paid"><span class="badge unpaid">Unpaid</span></td>
          </tr>
          <tr>
            <td>Vatican Tour</td>
            <td class="col-cost">$600.00</td>
            <td class="col-paid"><span class="badge paid">Paid</span></td>
            <td class="col-paid"><span class="badge unpaid">Unpaid</span></td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td class="label">Total</td>
            <td class="col-cost">$1400.00</td>
            <td colspan="2"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
</body>
</html>
