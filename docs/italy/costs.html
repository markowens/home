<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status of Purchased Events</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #23262b;
    --muted: #6b7280;
    --border: #e3e1db;
    --accent: #2f6f5e;
    --accent-soft: #e7f1ee;
    --paid: #2f6f5e;
    --unpaid: #b3541e;
    --unpaid-soft: #fbeee3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 780px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 24px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    text-align: left;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: #fafaf8;
  }

  th.col-cost, td.col-cost { text-align: right; }
  th.col-paid, td.col-paid { text-align: center; width: 110px; }

  tbody tr {
    border-bottom: 1px solid var(--border);
  }

  tbody tr:last-child { border-bottom: none; }

  td {
    padding: 8px 14px;
  }

  td input[type="text"],
  td input[type="number"] {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    font-size: 0.95rem;
    color: var(--ink);
    padding: 6px 8px;
    border-radius: 6px;
    font-family: inherit;
  }

  td input[type="text"]:hover,
  td input[type="number"]:hover {
    background: #f4f3f0;
  }

  td input[type="text"]:focus,
  td input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }

  td.col-cost input { text-align: right; }

  .paid-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    border: 1px solid transparent;
    user-select: none;
  }

  .paid-toggle.is-paid {
    background: var(--accent-soft);
    color: var(--paid);
  }

  .paid-toggle.is-unpaid {
    background: var(--unpaid-soft);
    color: var(--unpaid);
  }

  tfoot td {
    padding: 12px 14px;
    font-weight: 700;
    border-top: 1px solid var(--border);
    background: #fafaf8;
  }

  tfoot .label {
    color: var(--muted);
    font-weight: 500;
    font-size: 0.85rem;
  }

  .summary {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .summary strong {
    color: var(--ink);
  }

  .save-note {
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .save-note.visible {
    opacity: 1;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Status of Purchased Events</h1>
    <p class="subtitle">Track what's been bought, what it cost, and who's paid.</p>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th class="col-item">Item</th>
            <th class="col-cost">Cost</th>
            <th class="col-paid">Owens' Paid</th>
            <th class="col-paid">Thornton Paid</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <!-- rows inserted here -->
        </tbody>
        <tfoot>
          <tr>
            <td class="label">Total</td>
            <td class="col-cost" id="totalCost">$0.00</td>
            <td colspan="2"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="summary" id="summaryText"></div>
    <div class="save-note" id="saveNote">Saved to this browser</div>
  </div>

<script>
  const tbody = document.getElementById('tbody');
  const totalCostEl = document.getElementById('totalCost');
  const summaryText = document.getElementById('summaryText');
  const saveNote = document.getElementById('saveNote');

  const STORAGE_KEY = 'purchasedEventsStatus';

  // Edit this list directly to add, remove, or change items.
  // Any changes made in the browser are saved automatically and will
  // override this list on future visits (from the same browser) until
  // local storage is cleared.
  const defaultData = [
    { item: 'Venue Deposit', cost: 250, owensPaid: true, thorntonPaid: false },
    { item: 'Catering', cost: 480, owensPaid: false, thorntonPaid: false },
    { item: 'Decorations', cost: 95, owensPaid: false, thorntonPaid: true },
  ];

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {
      console.warn('Could not read saved data, using defaults.', e);
    }
    return defaultData;
  }

  function saveData() {
    const data = Array.from(tbody.children).map(tr => ({
      item: tr._getItem(),
      cost: tr._cost(),
      owensPaid: tr._isOwensPaid(),
      thorntonPaid: tr._isThorntonPaid(),
    }));
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      flashSaveNote();
    } catch (e) {
      console.warn('Could not save data.', e);
    }
  }

  let saveNoteTimer = null;
  function flashSaveNote() {
    saveNote.classList.add('visible');
    clearTimeout(saveNoteTimer);
    saveNoteTimer = setTimeout(() => saveNote.classList.remove('visible'), 1200);
  }

  function formatMoney(n) {
    const num = isNaN(n) ? 0 : n;
    return '$' + num.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function makePaidToggle(initialPaid) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'paid-toggle';
    let paid = !!initialPaid;
    function render() {
      btn.textContent = paid ? 'Paid' : 'Unpaid';
      btn.classList.toggle('is-paid', paid);
      btn.classList.toggle('is-unpaid', !paid);
    }
    render();
    btn.addEventListener('click', () => {
      paid = !paid;
      render();
      updateTotals();
      saveData();
    });
    btn.isPaid = () => paid;
    return btn;
  }

  function createRow(data = { item: '', cost: '', owensPaid: false, thorntonPaid: false }) {
    const tr = document.createElement('tr');

    const tdItem = document.createElement('td');
    const itemInput = document.createElement('input');
    itemInput.type = 'text';
    itemInput.placeholder = 'Item name';
    itemInput.value = data.item;
    itemInput.addEventListener('input', () => { updateTotals(); saveData(); });
    tdItem.appendChild(itemInput);

    const tdCost = document.createElement('td');
    tdCost.className = 'col-cost';
    const costInput = document.createElement('input');
    costInput.type = 'number';
    costInput.step = '0.01';
    costInput.placeholder = '0.00';
    costInput.value = data.cost;
    costInput.addEventListener('input', () => { updateTotals(); saveData(); });
    tdCost.appendChild(costInput);

    const tdOwens = document.createElement('td');
    tdOwens.className = 'col-paid';
    const owensBtn = makePaidToggle(data.owensPaid);
    tdOwens.appendChild(owensBtn);

    const tdThornton = document.createElement('td');
    tdThornton.className = 'col-paid';
    const thorntonBtn = makePaidToggle(data.thorntonPaid);
    tdThornton.appendChild(thorntonBtn);

    tr.appendChild(tdItem);
    tr.appendChild(tdCost);
    tr.appendChild(tdOwens);
    tr.appendChild(tdThornton);

    tr._getItem = () => itemInput.value;
    tr._cost = () => parseFloat(costInput.value) || 0;
    tr._isOwensPaid = () => owensBtn.isPaid();
    tr._isThorntonPaid = () => thorntonBtn.isPaid();

    return tr;
  }

  function updateTotals() {
    let total = 0;
    let owensPaidTotal = 0;
    let thorntonPaidTotal = 0;
    let count = 0;
    Array.from(tbody.children).forEach(tr => {
      const cost = tr._cost();
      total += cost;
      count += 1;
      if (tr._isOwensPaid()) owensPaidTotal += cost;
      if (tr._isThorntonPaid()) thorntonPaidTotal += cost;
    });
    totalCostEl.textContent = formatMoney(total);
    const remaining = total - owensPaidTotal - thorntonPaidTotal;
    summaryText.innerHTML =
      `<strong>${count}</strong> item${count === 1 ? '' : 's'} &middot; ` +
      `Owens' paid ${formatMoney(owensPaidTotal)} &middot; ` +
      `Thornton paid ${formatMoney(thorntonPaidTotal)} &middot; ` +
      `${formatMoney(remaining)} remaining`;
  }

  loadData().forEach(d => tbody.appendChild(createRow(d)));
  updateTotals();
</script>
</body>
</html>
